<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Terraform Guardrail five-version enterprise journey</title>
  <desc id="desc">A combined journey diagram explaining how Terraform Guardrail evolves from foundation scanning to enterprise governance, ecosystem integrations, intelligent decisions, and autonomous governance loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111a"/>
      <stop offset="0.45" stop-color="#102f34"/>
      <stop offset="1" stop-color="#2b2338"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.28" stop-color="#22c55e"/>
      <stop offset="0.53" stop-color="#f59e0b"/>
      <stop offset="0.76" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .title { font: 850 44px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 520 19px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .version { font: 900 20px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .label { font: 820 17px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 620 13px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 850 12px Inter, Segoe UI, Arial, sans-serif; fill: #ecfeff; }
      .panel { fill: url(#panel); stroke: rgba(255,255,255,0.2); stroke-width: 1.4; rx: 18; }
      .rail { fill: none; stroke: url(#flow); stroke-width: 12; stroke-linecap: round; opacity: 0.9; }
      .railSoft { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 36; stroke-linecap: round; }
      .node { fill: #0c2530; stroke-width: 3; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.18); stroke-width: 1; rx: 11; }
      .benefit { fill: rgba(45,212,191,0.12); stroke: rgba(45,212,191,0.35); stroke-width: 1.2; rx: 14; }
    </style>
  </defs>
  <rect width="1400" height="620" fill="url(#bg)"/>
  <path d="M80 500 C220 410 330 510 470 410 C640 286 720 156 910 218 C1080 274 1115 418 1320 322" fill="none" stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="96" stroke-linecap="round"/>
  <g transform="translate(64 58)">
    <text class="title" x="0" y="0">Terraform Guardrail: five releases, one enterprise governance loop</text>
    <text class="subtitle" x="0" y="36">Scan Terraform early, apply enterprise policy, scale across tools, explain decisions, and automate remediation with evidence.</text>
  </g>

  <path class="railSoft" d="M138 312 H1262"/>
  <path class="rail" d="M138 312 H1262"/>

  <g filter="url(#shadow)">
    <rect class="panel" x="62" y="190" width="232" height="234"/>
    <circle class="node" cx="178" cy="230" r="38" stroke="#38bdf8"/>
    <path d="M158 232 h40 M178 212 v40" stroke="#dff8ff" stroke-width="7" stroke-linecap="round"/>
    <text class="version" x="96" y="292">v1 Foundation</text>
    <text class="label" x="96" y="322">Start safe</text>
    <text class="small" x="96" y="350">Scan Terraform, package CLI,</text>
    <text class="small" x="96" y="370">run CI checks, publish rules.</text>
    <rect class="chip" x="96" y="388" width="112" height="28"/>
    <text class="tiny" x="118" y="407">Detect risk</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="318" y="148" width="232" height="276"/>
    <circle class="node" cx="434" cy="188" r="38" stroke="#22c55e"/>
    <path d="M416 180 h36 v24 h-36z M423 173 h22" fill="none" stroke="#dcfce7" stroke-width="5" stroke-linecap="round"/>
    <text class="version" x="352" y="250">v2 Enterprise</text>
    <text class="label" x="352" y="280">Govern centrally</text>
    <text class="small" x="352" y="308">Author policies, approve</text>
    <text class="small" x="352" y="328">baselines, bind groups,</text>
    <text class="small" x="352" y="348">export audit evidence.</text>
    <rect class="chip" x="352" y="388" width="128" height="28"/>
    <text class="tiny" x="373" y="407">Control drift</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="574" y="190" width="232" height="234"/>
    <circle class="node" cx="690" cy="230" r="38" stroke="#f59e0b"/>
    <path d="M670 230 h40 M690 210 v40" stroke="#ffedd5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="690" cy="230" r="14" fill="#ffedd5"/>
    <text class="version" x="608" y="292">v3 Ecosystem</text>
    <text class="label" x="608" y="322">Scale adoption</text>
    <text class="small" x="608" y="350">Policy packs, service API,</text>
    <text class="small" x="608" y="370">multi-cloud invariants, CI/CD.</text>
    <rect class="chip" x="608" y="388" width="132" height="28"/>
    <text class="tiny" x="626" y="407">Distribute rules</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="830" y="148" width="232" height="276"/>
    <circle class="node" cx="946" cy="188" r="38" stroke="#8b5cf6"/>
    <path d="M928 188 c0 -12 11 -21 23 -17 c11 -5 24 2 26 15 c10 4 13 18 4 27 c-4 10 -17 14 -27 7 c-10 6 -23 2 -27 -8 c-11 -4 -11 -18 1 -24z" fill="#f3e8ff"/>
    <text class="version" x="864" y="250">v4 Intelligent</text>
    <text class="label" x="864" y="280">Explain decisions</text>
    <text class="small" x="864" y="308">Context-aware severity,</text>
    <text class="small" x="864" y="328">suggested fixes, reports,</text>
    <text class="small" x="864" y="348">waivers, CI comments.</text>
    <rect class="chip" x="864" y="388" width="130" height="28"/>
    <text class="tiny" x="884" y="407">Guide teams</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="1086" y="190" width="252" height="234"/>
    <circle class="node" cx="1212" cy="230" r="38" stroke="#2dd4bf"/>
    <path d="M1190 230 a22 22 0 1 1 44 0 a22 22 0 1 1 -44 0" fill="none" stroke="#ccfbf1" stroke-width="5"/>
    <path d="M1226 210 l14 5 l-9 12 M1198 250 l-14 -5 l9 -12" fill="none" stroke="#ccfbf1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="version" x="1120" y="292">v5 Autonomous</text>
    <text class="label" x="1120" y="322">Operate the loop</text>
    <text class="small" x="1120" y="350">Remediation PRs, schedules,</text>
    <text class="small" x="1120" y="370">evidence, health, trends.</text>
    <rect class="chip" x="1120" y="388" width="144" height="28"/>
    <text class="tiny" x="1142" y="407">Close the loop</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="benefit" x="164" y="466" width="1072" height="78"/>
    <text class="label" x="200" y="498">Enterprise outcome</text>
    <text class="small" x="200" y="526">Platform teams define guardrails once. Developers get fast, explainable feedback. Security teams get enforceable baselines. Auditors get evidence. Operations get automation.</text>
  </g>
</svg>
