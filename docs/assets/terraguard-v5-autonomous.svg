<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Terraform Guardrail v5 Autonomous Governance feature map</title>
  <desc id="desc">An autonomous governance diagram showing remediation plans, patch bundles, GitHub pull requests, scheduled scans, evidence schedules, background runners, governance health, and trend dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08121a"/>
      <stop offset="0.46" stop-color="#12313a"/>
      <stop offset="1" stop-color="#2c2438"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .title { font: 800 42px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 800 18px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #c7d5e3; }
      .tiny { font: 800 12px Inter, Segoe UI, Arial, sans-serif; fill: #ecfeff; }
      .panel { fill: url(#panel); stroke: rgba(255,255,255,0.2); stroke-width: 1.5; rx: 16; }
      .wire { stroke: #2dd4bf; stroke-width: 2.5; stroke-linecap: round; opacity: 0.62; }
      .wirePurple { stroke: #a78bfa; stroke-width: 2.5; stroke-linecap: round; opacity: 0.64; }
      .node { fill: #10272e; stroke: #2dd4bf; stroke-width: 2; }
      .nodePurple { fill: #251936; stroke: #a78bfa; stroke-width: 2; }
      .nodeAmber { fill: #2c2311; stroke: #f59e0b; stroke-width: 2; }
      .chip { fill: rgba(45,212,191,0.13); stroke: rgba(45,212,191,0.48); stroke-width: 1; rx: 11; }
      .dash { fill: none; stroke: rgba(248,250,252,0.34); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 20 18; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <path d="M96 390 C218 320 292 404 408 318 C522 233 548 126 690 159 C822 190 834 327 972 281 C1056 253 1090 184 1138 208" fill="none" stroke="#8b5cf6" stroke-opacity="0.14" stroke-width="84" stroke-linecap="round"/>
  <g transform="translate(58 56)">
    <text class="title" x="0" y="0">v5 Autonomous Governance</text>
    <text class="subtitle" x="0" y="34">Operate the governance loop with remediation plans, PR automation, schedules, evidence, and trends.</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="408" y="124" width="384" height="272"/>
    <circle cx="600" cy="244" r="78" fill="url(#loop)"/>
    <circle cx="600" cy="244" r="46" fill="#08121a" opacity="0.86"/>
    <path class="dash" d="M562 244 a38 38 0 1 1 76 0 a38 38 0 1 1 -76 0"/>
    <path d="M624 206 l22 8 l-14 18" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M576 282 l-22 -8 l14 -18" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="504" y="338">Governance Loop</text>
    <text class="small" x="461" y="364">evaluate, remediate, schedule, export, observe</text>
  </g>
  <g>
    <line class="wire" x1="408" y1="184" x2="300" y2="126"/>
    <line class="wirePurple" x1="408" y1="252" x2="292" y2="252"/>
    <line class="wire" x1="408" y1="326" x2="306" y2="404"/>
    <line class="wirePurple" x1="792" y1="184" x2="914" y2="126"/>
    <line class="wire" x1="792" y1="252" x2="920" y2="252"/>
    <line class="wirePurple" x1="792" y1="326" x2="912" y2="404"/>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="76" y="86" width="282" height="96"/>
    <circle class="node" cx="120" cy="134" r="23"/>
    <path d="M109 127 h22 M109 136 h22 M109 145 h14" stroke="#dffdfa" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="156" y="128">Remediation Plans</text>
    <text class="small" x="156" y="153">findings to reviewable actions</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="58" y="208" width="300" height="96"/>
    <circle class="nodePurple" cx="102" cy="256" r="23"/>
    <path d="M91 248 h22 v18 h-22z M117 252 h6 M117 262 h6" fill="none" stroke="#eee7ff" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="138" y="250">Patch Bundles</text>
    <text class="small" x="138" y="275">branch, manifest, PR body, snippets</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="76" y="360" width="282" height="96"/>
    <circle class="nodeAmber" cx="120" cy="408" r="23"/>
    <path d="M109 409 l8 8 l16 -19" fill="none" stroke="#ffe7b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="156" y="402">GitHub PRs</text>
    <text class="small" x="156" y="427">dry-run plans or gh pr create</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="844" y="86" width="292" height="96"/>
    <circle class="node" cx="888" cy="134" r="23"/>
    <path d="M877 124 h22 M877 134 h22 M882 144 h12" stroke="#dffdfa" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="924" y="128">Scheduled Scans</text>
    <text class="small" x="924" y="153">multi-repo governance targets</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="862" y="208" width="274" height="96"/>
    <circle class="nodeAmber" cx="906" cy="256" r="23"/>
    <path d="M896 247 h20 v18 h-20z M901 242 h10" fill="none" stroke="#ffe7b8" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="942" y="250">Evidence Schedules</text>
    <text class="small" x="942" y="275">recurring JSON, CSV, PDF exports</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="panel" x="844" y="360" width="292" height="96"/>
    <circle class="nodePurple" cx="888" cy="408" r="23"/>
    <path d="M877 416 v-15 M888 416 v-24 M899 416 v-10" stroke="#eee7ff" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="924" y="402">Health + Trends</text>
    <text class="small" x="924" y="427">waivers, evidence, remediation flow</text>
  </g>
  <g transform="translate(402 422)">
    <rect class="chip" x="0" y="0" width="148" height="30"/>
    <text class="tiny" x="22" y="20">Autonomous</text>
    <rect class="chip" x="162" y="0" width="142" height="30"/>
    <text class="tiny" x="188" y="20">Auditable</text>
    <rect class="chip" x="318" y="0" width="154" height="30"/>
    <text class="tiny" x="340" y="20">Operator-ready</text>
  </g>
</svg>
