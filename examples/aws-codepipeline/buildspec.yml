version: 0.2

phases:
  install:
    commands:
      - curl -fsSL https://guardrail.sh/install | bash
  pre_build:
    commands:
      - terraform init
      - terraform plan -out=tfplan
      - EVALUATE_EXIT=0
      - terraform-guardrail evaluate . --provider aws --baseline org-baseline --format json > guardrail-report.json || EVALUATE_EXIT=$?
      - RESULT_ID=$(python -c "import json; print(json.load(open('guardrail-report.json'))['id'])")
      - terraform-guardrail evidence export "$RESULT_ID" --format json
      - cp .guardrail/enterprise/evidence/*.json guardrail-evidence.json
      - test "$EVALUATE_EXIT" -eq 0
  build:
    commands:
      - terraform apply -auto-approve tfplan
artifacts:
  files:
    - guardrail-report.json
    - guardrail-evidence.json
