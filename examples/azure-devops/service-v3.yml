trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  GUARDRAIL_API_URL: "http://127.0.0.1:8080"

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - script: |
      pip install .
      terraform-guardrail api --host 127.0.0.1 --port 8080 &
      for i in $(seq 1 20); do
        curl -fsS "$(GUARDRAIL_API_URL)/health" && exit 0
        sleep 1
      done
      exit 1
    displayName: Start TerraGuard service API

  - script: |
      curl -fsS -X POST "$(GUARDRAIL_API_URL)/service/evaluate" \
        -H "content-type: application/json" \
        -d "{
          \"path\":\"examples/fixtures/terraform/bad\",
          \"state_path\":\"examples/fixtures/state/bad.tfstate\",
          \"request_id\":\"ado-$(Build.BuildId)\",
          \"provider\":\"aws\",
          \"policy_pack\":\"aws-control-tower\",
          \"context\":{\"repo\":\"$(Build.Repository.Name)\",\"environment\":\"$(Build.SourceBranchName)\"},
          \"fail_on\":\"high\",
          \"evidence_format\":\"json\",
          \"actor\":\"azure-devops\"
        }" | tee guardrail-service-response.json
    displayName: Evaluate with v3 service contract

  - script: |
      python - <<'PY'
      import json
      import sys

      with open("guardrail-service-response.json", encoding="utf-8") as handle:
          payload = json.load(handle)
      print(f"TerraGuard decision: {payload['decision']}")
      if payload["decision"] == "block":
          sys.exit(1)
      PY
    displayName: Enforce TerraGuard decision

  - script: |
      python - <<'PY'
      import json
      import urllib.request

      with open("guardrail-service-response.json", encoding="utf-8") as handle:
          payload = json.load(handle)
      url = "$(GUARDRAIL_API_URL)/results/" + payload["result_id"] + "/comment"
      with urllib.request.urlopen(url) as response:
          comment = response.read().decode("utf-8")
      with open("guardrail-comment.md", "w", encoding="utf-8") as handle:
          handle.write(comment)
      print(comment)
      base = "$(GUARDRAIL_API_URL)/results/" + payload["result_id"] + "/reports/"
      for name, suffix in {
          "guardrail-report.sarif": "sarif",
          "guardrail-report.junit.xml": "junit",
      }.items():
          with urllib.request.urlopen(base + suffix) as response:
              content = response.read().decode("utf-8")
          with open(name, "w", encoding="utf-8") as handle:
              handle.write(content)
      PY
    condition: always()
    displayName: Render v4 PR comment markdown

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: "guardrail-service-response.json"
      ArtifactName: "terraguard-v3-service-response"

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: "guardrail-comment.md"
      ArtifactName: "terraguard-v4-comment"

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: "guardrail-report.sarif"
      ArtifactName: "terraguard-v4-sarif"

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: "JUnit"
      testResultsFiles: "guardrail-report.junit.xml"

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: ".guardrail/enterprise/evidence"
      ArtifactName: "terraguard-v3-evidence"
