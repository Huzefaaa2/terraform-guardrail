name: Policy pack request
description: Request or improve an enterprise policy pack.
title: "[Policy Pack]: "
labels: ["enhancement", "policy-pack"]
body:
  - type: input
    id: pack
    attributes:
      label: Pack name
      placeholder: pci-dss, aws-control-tower, azure-landing-zone
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Standard or framework
      placeholder: SOC2, PCI DSS, ISO 27001, internal standard
  - type: textarea
    id: controls
    attributes:
      label: Controls
      description: List control IDs, rule IDs, providers, and expected remediation text.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence expectations
      description: What should audit evidence include?
